version: '3.9'

services:
  api:
    build:
      context: ./backend 
      dockerfile: Dockerfile             
    ports:
      - "5155:5155"                   
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - final_network

  app:
    build:
      context: ./frontend                      
      dockerfile: Dockerfile
    depends_on:
      - api                            
    ports:
      - "3001:80"                        
    networks:
      - final_network

networks:
  final_network:
    driver: bridge                      
